<body style="height:2000px; background-color:#383838"></body>
<div class="p-5 mb-4 bg-light rounded-3">
    <div class="container py-5 " align="center">
        <h1 style="color:black; font-family:verdana; font-weight: bold;">Event Creation</h1>
    </div>
</div>
<div class="container" align="center">
    <form>
        <div class="row">
            <div class="col-auto">
                <br>
                <h2>Event Name</h2>
                <input type="text" id="formItem" class="form-control" style="width:500px;"
                    placeholder="e.g. Atlantic Coding Comp">
            </div>
            <div class="col-3"></div>
            <div class="col-auto">
                <br>
                <h2>Image Upload</h2>
                <input class="form-control" id="formFileLg" type="file">
            </div>
        </div>
        <div class="row gy-5">
            <div class="p-3"></div>
            <h3>Description</h3>

            <textarea class="form-control" id="" rows="9" style="width:40%; margin: 0 auto;"></textarea>
        </div>

        <div class="row">
            <br>
            <div></div>
            <h3>Select Date of Event</h3>
            <div class="col-auto mx-auto">

                <label for="start" style="color:white; font-size:larger; ">Start Date:</label>
                <input type="date" id="start" name="trip-start">
            </div>
            <div class="col-auto mx-auto">

                <label for="start" style="color:white; font-size:larger; ">End Date:</label>
                <input type="date" id="start" name="trip-start">
            </div>
        </div>


        <button class="btn btn-primary btn-lg mt-5" type="button">Create Event</button>

    </form>
</div>
