<!DOCTYPE html>

{% extends "header.html"%}
{% block header %}

<main>
    <!--Event Creation-->   
    <div class="container event-creation">
        <div class="row">
            <div class="col-md-12 section-heading">
                <h2>Create Event</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <form>
                    <div class="form-group mb-3">
                        <label>Event Name</label>
                        <input type="text" class="form-control" placeholder="Enter event name">
                    </div>
                    <div class="form-group mb-3">
                        <label>Event Description</label>
                        <input type="text" class="form-control" placeholder="Enter event description">
                    </div>
                    <div class="form-group mb-3">
                        <label >Event Date</label>
                        <input type="date" class="form-control" placeholder="Enter event date">
                    </div>
                    <div class="form-group mb-3">
                        <label>Event Image</label>
                        <input type="file" class="form-control" placeholder="Enter event image">
                    </div>
                    <div class="form-group mb-3">
                        <label>Event Location</label>
                        <input type="text" class="form-control" placeholder="Enter event location">
                    </div>
                    <div class="form-group mb-3">
                        <label>Ticket Quantity Available</label>
                        <input type="number" class="form-control" placeholder="Enter quantity of tickets available">
                    </div>
                    <div class="form-group mb-3">
                        <label>Ticket Price</label>
                        <input type="number" class="form-control" placeholder="Enter ticket price">
                    </div>
                    <div class="form-group mb-3">
                        <label for="event_category">Select Category</label>
                        <select list="genres" class="form-control"  >
                            <option value="Business Case Competition">Business Case Competition</option>
                            <option value="Coding Competition">Coding Competition</option>
                            <option value="Datathon">Datathon</option>
                            <option value="Hackathon">Hackathon</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <button type="submit" class="btn btn-primary btn-view create-btn">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

{% endblock %}
